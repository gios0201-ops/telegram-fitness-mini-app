name: Test and publish GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-build:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:publish
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build for repository or user Pages
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [[ "$REPO_NAME" == *.github.io ]]; then
            export VITE_BASE_PATH=/
          else
            export VITE_BASE_PATH="/$REPO_NAME/"
          fi
          echo "VITE_BASE_PATH=$VITE_BASE_PATH" >> "$GITHUB_ENV"
          npm run build
      - name: Test built Pages path
        env:
          E2E_PRODUCTION: "1"
          E2E_BASE_PATH: ${{ env.VITE_BASE_PATH }}
        run: npm run test:e2e
      - run: npm run check:secrets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
